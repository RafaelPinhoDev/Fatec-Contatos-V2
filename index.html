<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"/>
    <script src="./app.js" defer type="module"></script>
    <link rel="stylesheet" href="./css/style.css" />
    <title>Agenda de Contatos</title>
  </head>
  <body class="bg-light">
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-person-lines-fill"></i> Agenda de Contatos
            </a>
        </div>
      </nav>
    </header>

    <main class="container mt-4">
      
      <section class="row justify-content-center mb-5">
        <div class="col-12">
          <div class="card border-primary rounded-3 shadow-sm">
            <div class="card-header bg-primary text-white py-2">
              <h1 id="titulo-form" class="fs-5 fw-bold mb-0 text-center text-white">Cadastrar Contato</h1>
            </div>
            
            <form id="form-cadastro" class="p-4 row g-3 align-items-center">
              <input type="hidden" id="id">
              
              <div class="col-md-4">
                  <label for="nome" class="form-label mb-1 fw-bold">Nome Completo:</label>
                  <input id="nome" class="form-control" type="text" placeholder="Ex: Pedro Alves" required>
              </div>
              
              <div class="col-md-3">
                  <label for="celular" class="form-label mb-1 fw-bold">Celular:</label>
                  <input id="celular" class="form-control" type="tel" placeholder="Ex 11903752567" required>
              </div>

              <div class="col-md-5">
                  <label for="email" class="form-label mb-1 fw-bold">E-mail:</label>
                  <input id="email" class="form-control" type="email" placeholder="Ex: seunome@gmail.com" required >
              </div>
              
              <div class="col-md-5">
                  <label for="endereco" class="form-label mb-1 fw-bold">Endereço:</label>
                  <input id="endereco" class="form-control" type="text" placeholder="Ex: Rua das Orquideas, 123" required >
              </div>
              
              <div class="col-md-3">
                  <label for="cidade" class="form-label mb-1 fw-bold">Cidade:</label>
                  <input id="cidade" class="form-control" type="text" placeholder="Ex: São Roque" required >
              </div>
              
              <div class="col-md-4">
                <label class="form-label mb-1 fw-bold">Foto:</label>
                <div class="d-flex align-items-center gap-2">
                  <div class="preview-container">
                      <input id="preview-input" class="preview-input" type="file" accept="image/*">
                      <label class="preview-label" for="preview-input"></label>
                      <img id="preview-image" class="preview-image" src="./img/upload-icon.svg" alt="Preview">
                      <input type="hidden" id="foto" required>
                  </div>
                  <button type="button" id="limpar-foto" class="btn btn-danger btn-sm fw-bold">Limpar</button>
                </div>
              </div>
              
              <div class="col-12 d-flex gap-2 mt-3 justify-content-end">
                  <button type="submit" id="cadastrar" class="btn btn-success px-5 fw-bold">Salvar</button>
                  <button type="reset" class="btn btn-warning px-4 fw-bold">Limpar Campos</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="row justify-content-center">
        <div class="col-12">
          <article id="article-contatos" class="bg-white rounded-3 shadow-sm border overflow-hidden">
            
            <div class="card-header bg-primary text-white py-2 mb-4">
              <h2 class="fs-5 fw-bold mb-0 text-center text-white">Consultar Contatos</h2>
            </div>

            <div class="p-4 pt-0">
              <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
                <label for="input-contato" class="text-nowrap mb-0 fw-bold">Pesquisar:</label>
                <input id="input-contato" class="form-control border-2" type="text" placeholder="Ex: Pedro"/>
                <button id="botao-pesquisar" class="btn btn-success fw-bold px-4"> Pesquisar </button>
              </div>

              <hr class="mb-4 text-primary">

              <div class="row g-4" id="lista-contatos"></div>
              <div id="sem-contato"></div>
            </div>

          </article>
        </div>
      </section>

    </main>

    <footer class="bg-primary text-white py-3 mt-5 shadow-sm">
      <div class="container text-center">
          <small class="fw-bold">
              &copy; 2026 Rafael Souza de Pinho — Sistemas para Internet
          </small>
      </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
